  - id: api-key-read-auth-public-prompts
    status: skipped
    workflow: auto
    prompt: prompts/auto-implement.md
    project: prompt-scorer-api
    task_type: feature
    context_files: &a1
      - src/handlers/prompts/getPublic.js
      - src/handlers/apiKeys/manage.js
    variables:
      feature_name: optional API key authentication on GET /prompts/public
      feature_description: >
        Update src/handlers/prompts/getPublic.js to support optional API key auth so external developers can query the
        public prompt library programmatically.

        When an Authorization: Bearer ps_sk_* header is present: 1. STRICT FORMAT VALIDATION FIRST: Before any DynamoDB
        lookup, validate the token format strictly.
           The key must match the exact regex /^ps_sk_[A-Za-z0-9]{32,64}$/ — reject anything that does not
           match with 401: { error: 'Invalid or revoked API key' }. This prevents arbitrary strings from
           reaching the database lookup.
        2. Look up the validated key in DynamoDB using the same pattern already used in
           src/handlers/apiKeys/manage.js (query the api-keys table by keyHash or agentId).
        3. If the key is found and not revoked, the request proceeds normally with agent context attached.
           Include callerType: 'agent' and agentId in the top-level response JSON.
           Also add a response header: x-authenticated-as: agent.
        4. If the key is invalid, not found, or revoked, return 401: { error: 'Invalid or revoked API key' }.
           Always return the same generic message regardless of reason — do not distinguish between
           "not found" and "revoked" to avoid key enumeration.

        SECURITY REQUIREMENTS (previous attempt was rejected for violating these — do not skip them): -
        touchApiKeyLastUsed MUST be wrapped in its own try/catch so a failure updating lastUsedAt never
          causes the request to fail or leak an error. Log the error silently and let the request succeed.
        - touchApiKeyLastUsed MUST only be called AFTER the key has been confirmed valid and not revoked.
          Never update lastUsedAt on an invalid key.
        - The lastUsedAt update is fire-and-forget (do not await it in the main request path). This avoids
          any latency hit and makes the race condition on concurrent requests irrelevant.

        When no Authorization header is present, existing behavior is completely unchanged — unauthenticated public
        access still works as before.

        Use AWS SDK v3 DynamoDB DocumentClient (require('@aws-sdk/lib-dynamodb')) to match the existing codebase
        pattern. Do NOT add or modify any route definitions in resources/functions.yml — the endpoint already exists
        without an authorizer.
    started_at: 2026-03-17T00:51:58.166Z
    completed_at: 2026-03-17T00:54:01.995Z
    branch: auto/api-key-read-auth-public-prompts
    merge_status: escalated
