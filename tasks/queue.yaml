tasks:
  - id: fix-leaderboard-filters-and-stats
    status: completed
    workflow: auto
    prompt: prompts/auto-implement.md
    project: prompt-scorer-api
    task_type: maintenance
    context_files:
      - src/handlers/revisions/top.js
      - src/models/revisions.js
    variables:
      feature_name: leaderboard advanced filters and summary stats
      feature_description: >
        Update src/handlers/revisions/top.js to fix two silent gaps that make the leaderboard UI non-functional for
        advanced use.

        1. FILTERS: The handler ignores minScore, authorId, and promptId query params even though the UI sends them. Add
        support for all three, applied in-memory after the DynamoDB query: - minScore (number): exclude revisions with
        score < minScore - authorId (string): only include revisions where revision.authorId === authorId - promptId
        (string): only include revisions where revision.promptId === promptId Apply these in the same filtering pass as
        the existing status filter. Cursor pagination must still work correctly after filtering.

        2. SUMMARY STATS: The UI expects a summaryStats object but the handler never returns it. After filtering the
        full result set (before cursor pagination), calculate and return:
          summaryStats: {
            totalRevisions: count of all revisions matching filters,
            averageScore: mean of scores across all matching revisions (1 decimal, e.g. 74.3),
            uniquePromptsCount: count of distinct promptIds in the full filtered set
          }
        summaryStats must reflect the full filtered set, not just the current cursor page. Final response shape: {
        items: [...paginated...], cursor: ..., summaryStats: { ... } }
    started_at: 2026-03-17T00:13:34.009Z
    completed_at: 2026-03-17T00:14:58.835Z
    branch: auto/fix-leaderboard-filters-and-stats
    merge_status: merged
    pr_number: 274
    pr_url: https://github.com/PromptScorer/prompt-scorer-sls-api/pull/274
