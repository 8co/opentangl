  - id: ui-agent-review-completion-polling
    status: skipped
    workflow: auto
    prompt: prompts/auto-implement.md
    project: prompt-scorer-ui
    task_type: feature
    context_files: &a2
      - src/pages/ViewPromptPage.tsx
      - src/components/AgentReviewControls.tsx
      - src/services/api-service.ts
    variables:
      feature_name: agent review status badge and live completion polling
      feature_description: >
        The agent review pipeline posts a revision and comment automatically but the author has no visibility into
        whether a review is pending, in-progress, or complete.

        Add two things to ViewPromptPage.tsx:

        1. STATUS BADGE: Add a small inline badge near the prompt title/metadata area. Badge states based on
        agentReviewStatus.status (or agentReviewStatus?.status): - 'queued' or 'processing': pulsing amber badge "AI
        Review Pending" - 'reviewed': green/teal badge with a sparkle icon "AI Reviewed" - null / undefined /
        'dismissed': render nothing

        2. LIVE POLLING: When agentReviewStatus.status is 'queued' or 'processing', poll GET
        /prompts/{promptId}/agent-review/status-history every 8 seconds using setInterval. Stop polling when status
        becomes 'reviewed' or 'dismissed', or on component unmount (clearInterval in useEffect cleanup). The current
        status is the status field of the most recent entry in the history array returned by that endpoint. When status
        transitions to 'reviewed', invalidate and refetch the main prompt data (using React Query's
        queryClient.invalidateQueries or the existing refetch pattern) so the new agent revision and comment appear
        automatically without a manual refresh.

        Use the same fetch + Bearer token auth pattern already present in the component. Do NOT modify the
        AgentReviewControls panel, tab structure, or any existing section. Only add the badge element and the polling
        side-effect.
